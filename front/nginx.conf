# Front nginx: sert le build statique Vite ET reverse-proxie /api vers le back.
# CopilotKit utilisent runtimeUrl="/api/copilotkit" (chemin relatif), donc tout ce
# qui passe par /api est transféré au service Spring Boot « back » du compose.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # API -> backend Spring Boot (AG-UI sous /api/copilotkit)
    location /api/ {
        proxy_pass http://back:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;      # streaming AG-UI text
        proxy_read_timeout 300s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
